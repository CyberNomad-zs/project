openapi: 3.0.3
info:
  title: 清泉跨境系统 API
  version: 0.1.0
  description: |
    Phase 0 接口草案。鉴权：用户 JWT（Bearer）或采集 API Key（X-Api-Key）。
servers:
  - url: http://localhost:8000
    description: local
tags:
  - name: health
  - name: auth
  - name: shops
  - name: ingest
  - name: tasks
  - name: export
  - name: collectors

paths:
  /health:
    get:
      tags: [health]
      summary: 健康检查
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: ok }
                  time: { type: string, format: date-time }

  /api/v1/auth/login:
    post:
      tags: [auth]
      summary: 登录
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, password]
              properties:
                username: { type: string }
                password: { type: string, format: password }
      responses:
        "200":
          description: JWT
          content:
            application/json:
              schema:
                type: object
                properties:
                  access_token: { type: string }
                  token_type: { type: string, example: bearer }
                  expires_in: { type: integer }
        "401":
          description: 用户名或密码错误

  /api/v1/auth/me:
    get:
      tags: [auth]
      summary: 当前用户
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: 用户资料
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"

  /api/v1/shops:
    get:
      tags: [shops]
      summary: 店铺列表
      security: [{ bearerAuth: [] }]
      parameters:
        - in: query
          name: platform
          schema: { type: string, enum: [amazon, tiktok, temu, other] }
        - in: query
          name: status
          schema: { type: string, enum: [active, disabled] }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/Shop" }
    post:
      tags: [shops]
      summary: 创建店铺
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ShopCreate" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Shop" }

  /api/v1/shops/{shopId}:
    patch:
      tags: [shops]
      summary: 更新店铺
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/shopId"
      requestBody:
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ShopUpdate" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Shop" }

  /api/v1/ingest/{source}:
    post:
      tags: [ingest]
      summary: 采集上报（单条或批量）
      security: [{ apiKeyAuth: [] }]
      parameters:
        - in: path
          name: source
          required: true
          schema:
            type: string
            enum:
              - tiktok_ads
              - temu_browser
              - temu_openapi
              - sellfox_sales
              - sellfox_performance
              - sellfox_product_temu
              - sellfox_sales_days
              - amazon_front
              - wms_inventory
              - hwc_bridge_event
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - $ref: "#/components/schemas/IngestEnvelope"
                - $ref: "#/components/schemas/IngestBatch"
            examples:
              single:
                summary: 单条 TK 广告
                value:
                  platform: tiktok
                  shop_id: "27501502216807"
                  shop_name: Deal to deal
                  biz_date: "2026-07-26"
                  collected_at: "2026-07-27T17:25:01+08:00"
                  idempotency_key: "tiktok_ads:27501502216807:拖把7/13:2026-07-26"
                  payload:
                    campaign_name: "拖把7/13"
                    spend: 187.79
                    orders: 121
                    roi: 9.9
                    revenue: 1872.64
                    row_status: success
              batch:
                summary: 批量
                value:
                  items:
                    - platform: tiktok
                      shop_id: "27501502216807"
                      shop_name: Deal to deal
                      biz_date: "2026-07-26"
                      collected_at: "2026-07-27T17:25:01+08:00"
                      idempotency_key: "tiktok_ads:27501502216807:拖把7/13:2026-07-26"
                      payload:
                        campaign_name: "拖把7/13"
                        spend: 187.79
                        orders: 121
                        roi: 9.9
                        revenue: 1872.64
      responses:
        "200":
          description: 接受（含幂等命中）
          content:
            application/json:
              schema: { $ref: "#/components/schemas/IngestResult" }
        "401":
          description: API Key 无效
        "422":
          description: 校验失败

  /api/v1/tasks:
    get:
      tags: [tasks]
      summary: 任务列表
      security: [{ bearerAuth: [] }]
      parameters:
        - in: query
          name: status
          schema: { type: string, enum: [open, in_progress, resolved, cancelled] }
        - in: query
          name: platform
          schema: { type: string }
        - in: query
          name: shop_id
          schema: { type: string, format: uuid }
        - in: query
          name: owner_user_id
          schema: { type: string, format: uuid }
        - in: query
          name: page
          schema: { type: integer, default: 1 }
        - in: query
          name: page_size
          schema: { type: integer, default: 20 }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  total: { type: integer }
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/Task" }
    post:
      tags: [tasks]
      summary: 手动创建任务
      security: [{ bearerAuth: [] }]
      requestBody:
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TaskCreate" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Task" }

  /api/v1/tasks/{taskId}/progress:
    post:
      tags: [tasks]
      summary: 更新进度（进行中任务）
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/taskId"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [note]
              properties:
                note: { type: string }
                status:
                  type: string
                  enum: [open, in_progress]
                action_code:
                  type: string
                  description: 可选运营动作码（须存在于 ops_action_dict）
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Task" }

  /api/v1/tasks/{taskId}/resolve:
    post:
      tags: [tasks]
      summary: 闭环任务
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/taskId"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                note: { type: string }
                action_code: { type: string }
                effect_code:
                  type: string
                  description: 骨架类型（amazon/link_wow_units_drop、tiktok/low_roi、temu/listing_off）必填
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Task" }

  /api/v1/kb/guidance:
    get:
      tags: [kb]
      summary: A+B 指导（历史统计 + 已发布剧本）
      security: [{ bearerAuth: [] }]
      parameters:
        - name: platform
          in: query
          required: true
          schema: { type: string }
        - name: anomaly_type
          in: query
          required: true
          schema: { type: string }
      responses:
        "200":
          description: history + published playbooks only
          content:
            application/json:
              schema:
                type: object
                properties:
                  platform: { type: string }
                  anomaly_type: { type: string }
                  history:
                    type: array
                    items:
                      type: object
                      properties:
                        action_code: { type: string }
                        count: { type: integer }
                        effects: { type: object }
                  playbooks:
                    type: array
                    items: { type: object }

  /api/v1/kb/playbooks/generate-draft:
    post:
      tags: [kb]
      summary: 从历史聚合生成剧本草稿（draft，不进入 guidance.playbooks）
      security: [{ bearerAuth: [] }]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [platform, anomaly_type]
              properties:
                platform: { type: string }
                anomaly_type: { type: string }
      responses:
        "201":
          description: Draft playbook

  /api/v1/kb/playbooks/{playbookId}/publish:
    post:
      tags: [kb]
      summary: 发布剧本 draft→published
      security: [{ bearerAuth: [] }]
      parameters:
        - name: playbookId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Published playbook

  /api/v1/kb/playbooks/{playbookId}/demote:
    post:
      tags: [kb]
      summary: 降级剧本 published→draft
      security: [{ bearerAuth: [] }]
      parameters:
        - name: playbookId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Draft playbook

  /api/v1/kb/metric-backfill:
    post:
      tags: [kb]
      summary: 指标效果回填（amazon/link_wow_units_drop；无 fact 时 skipped）
      security: [{ bearerAuth: [] }]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [task_id]
              properties:
                task_id: { type: string, format: uuid }
                window_days: { type: integer, default: 7 }
      responses:
        "200":
          description: ok 或 skipped

  /api/v1/export/feishu:
    post:
      tags: [export]
      summary: 触发飞书同步
      security: [{ bearerAuth: [] }]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                table_key:
                  type: string
                  description: 逻辑表，如 tasks / tk_ads_daily
                  example: tasks
                mode:
                  type: string
                  enum: [incremental, rebuild]
                  default: incremental
                biz_date:
                  type: string
                  format: date
      responses:
        "202":
          description: 已入队
          content:
            application/json:
              schema:
                type: object
                properties:
                  job_id: { type: string, format: uuid }

  /api/v1/collectors/heartbeat:
    post:
      tags: [collectors]
      summary: 边缘节点心跳
      security: [{ apiKeyAuth: [] }]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [node_id]
              properties:
                node_id: { type: string }
                version: { type: string }
                meta: { type: object, additionalProperties: true }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  server_time: { type: string, format: date-time }
                  config_version: { type: string }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    apiKeyAuth:
      type: apiKey
      in: header
      name: X-Api-Key

  parameters:
    shopId:
      in: path
      name: shopId
      required: true
      schema: { type: string, format: uuid }
    taskId:
      in: path
      name: taskId
      required: true
      schema: { type: string, format: uuid }

  schemas:
    User:
      type: object
      properties:
        id: { type: string, format: uuid }
        username: { type: string }
        display_name: { type: string }
        is_admin: { type: boolean }

    Shop:
      type: object
      properties:
        id: { type: string, format: uuid }
        platform: { type: string }
        external_shop_id: { type: string }
        name: { type: string }
        primary_owner_user_id: { type: string, format: uuid, nullable: true }
        timezone: { type: string }
        currency: { type: string }
        status: { type: string }
        meta: { type: object, additionalProperties: true }

    ShopCreate:
      type: object
      required: [platform, external_shop_id, name]
      properties:
        platform: { type: string }
        external_shop_id: { type: string }
        name: { type: string }
        primary_owner_user_id: { type: string, format: uuid }
        timezone: { type: string, default: Asia/Shanghai }
        currency: { type: string, default: GBP }
        meta: { type: object }

    ShopUpdate:
      type: object
      properties:
        name: { type: string }
        primary_owner_user_id: { type: string, format: uuid, nullable: true }
        status: { type: string }
        meta: { type: object }

    IngestEnvelope:
      type: object
      required: [idempotency_key, payload]
      properties:
        platform: { type: string }
        shop_id:
          type: string
          description: 外部店铺 ID（赛狐/紫鸟等）
        shop_name: { type: string }
        biz_date: { type: string, format: date }
        collected_at: { type: string, format: date-time }
        idempotency_key: { type: string, maxLength: 256 }
        payload: { type: object, additionalProperties: true }
        evidence:
          type: object
          properties:
            screenshot_url: { type: string, nullable: true }
            source_url: { type: string, nullable: true }
            raw_ref: { type: string, nullable: true }

    IngestBatch:
      type: object
      required: [items]
      properties:
        items:
          type: array
          minItems: 1
          maxItems: 500
          items: { $ref: "#/components/schemas/IngestEnvelope" }

    IngestResult:
      type: object
      properties:
        accepted: { type: integer }
        duplicated: { type: integer }
        failed: { type: integer }
        results:
          type: array
          items:
            type: object
            properties:
              idempotency_key: { type: string }
              id: { type: string, format: uuid }
              status: { type: string, enum: [created, duplicated, failed] }
              error: { type: string, nullable: true }

    Task:
      type: object
      properties:
        id: { type: string, format: uuid }
        dedupe_key: { type: string }
        status: { type: string, enum: [open, in_progress, resolved, cancelled] }
        platform: { type: string }
        shop_id: { type: string, format: uuid, nullable: true }
        anomaly_type: { type: string }
        biz_id: { type: string }
        title: { type: string }
        owner_user_id: { type: string, format: uuid, nullable: true }
        due_at: { type: string, format: date-time, nullable: true }
        progress_note: { type: string, nullable: true }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        resolved_at: { type: string, format: date-time, nullable: true }

    TaskCreate:
      type: object
      required: [platform, anomaly_type, biz_id, title]
      properties:
        platform: { type: string }
        shop_id: { type: string, format: uuid }
        anomaly_type: { type: string }
        biz_id: { type: string }
        title: { type: string }
        owner_user_id: { type: string, format: uuid }
        due_at: { type: string, format: date-time }
        progress_note: { type: string }
