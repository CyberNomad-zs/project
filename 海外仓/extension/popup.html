<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<style>
  body { width: 380px; font: 13px/1.55 "Microsoft YaHei", system-ui, sans-serif; margin: 0; padding: 12px; }
  h1 { font-size: 14px; margin: 0 0 8px; }
  .row { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
  .dry { display: inline-flex; align-items: center; gap: 6px; background: #fff3cd; color: #8a6d00;
         border: 1px solid #ffe08a; border-radius: 5px; padding: 4px 8px; font-size: 12px; }
  button { flex: 1; padding: 9px; font-size: 13px; border: 0; border-radius: 6px; color: #fff; cursor: pointer; }
  #run { background: #2f6fed; }
  #run.live { background: #c23b3b; }
  button:disabled { opacity: .6; cursor: default; }
  .hint { color: #666; font-size: 12px; margin: 0 0 8px; }
  pre { background: #0f1420; color: #d6e2ff; border-radius: 6px; padding: 10px; margin: 8px 0 0;
        white-space: pre-wrap; word-break: break-all; height: 300px; overflow: auto; font-size: 12px; }
</style>
</head>
<body>
  <h1>海外仓发货助手</h1>
  <p class="hint">先在本浏览器打开并登录 <b>赛狐 ERP 订单页</b> 和 <b>海外仓 WMS</b> 两个标签页，再点开始。<br>
     按渠道串行闭环，只处理 WMS 当前登录店铺对应的渠道。</p>
  <div class="row">
    <label class="dry"><input type="checkbox" id="dry" checked> DRY 空跑（不真实下单/发货）</label>
  </div>
  <div class="row">
    <button id="run">开始发货</button>
    <button id="probe" style="flex:0 0 96px;background:#555">ERP 探测</button>
  </div>
  <div class="row">
    <button id="confirmShip" style="background:#0a8a5f">三方仓成功→确认发货</button>
  </div>
  <pre id="out">就绪。建议第一次务必勾选 DRY 空跑，核对每个渠道的筛选/数量无误后再取消勾选真跑。</pre>
  <script src="popup.js"></script>
</body>
</html>
